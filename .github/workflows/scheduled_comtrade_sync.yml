name: UN Comtrade Auto-Sync to Google Drive

on:
  schedule:
    # Runs once a day Mon-Fri at 06:00 UTC (13:00 Bangkok Time UTC+7)
    - cron: '0 6 * * 1-5'
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Number of days back to check releases (default: 7)'
        required: false
        default: '7'
      force:
        description: 'Force sync even if no new release announced'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: comtrade-gdrive-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Detect & Sync Rice Data to Google Drive
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🛰️ Run Google Drive Sync Pipeline
        env:
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_IMPORT_CSV_ID: ${{ secrets.GDRIVE_IMPORT_CSV_ID }}
          GDRIVE_EXPORT_CSV_ID: ${{ secrets.GDRIVE_EXPORT_CSV_ID }}
          GDRIVE_IMPORT_PARQUET_ID: ${{ secrets.GDRIVE_IMPORT_PARQUET_ID }}
          GDRIVE_EXPORT_PARQUET_ID: ${{ secrets.GDRIVE_EXPORT_PARQUET_ID }}
        run: |
          DAYS="${{ inputs.days_back || '7' }}"
          FORCE_FLAG=""
          if [ "${{ inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python run_pipeline.py gdrive-sync --days "$DAYS" $FORCE_FLAG

      - name: 💾 Commit & Push sync_state.json if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f sync_state.json ]; then
            git add sync_state.json
            if ! git diff-index --quiet HEAD; then
              git commit -m "chore(sync): update sync_state.json [skip ci]"
              git pull --rebase origin "${{ github.ref_name }}"
              git push
            fi
          fi
