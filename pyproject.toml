[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "comtrade-pipeline"
version = "2.2.0"
description = "UN Comtrade data download and analysis pipeline"
requires-python = ">=3.9"
dependencies = [
    "comtradeapicall>=1.3.2",
    "pandas>=2.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "pyarrow>=14.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.1.0",
    "google-auth-httplib2>=0.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
comtrade = "comtrade_pipeline.cli:main"

[tool.setuptools]
packages = ["comtrade_pipeline"]

[tool.setuptools.package-data]
comtrade_pipeline = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

