[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "comtrade-pipeline"
version = "2.0.0"
description = "UN Comtrade data download and analysis pipeline"
requires-python = ">=3.9"
dependencies = [
    "comtradeapicall==1.3.2",
    "pandas>=2.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
comtrade = "comtrade_pipeline.cli:main"

[tool.setuptools]
packages = ["comtrade_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

